name: Suivi des ventes

# Chaque lancement fait 2 passages espacés d'environ 15 min, publie la page,
# puis relance le suivant. La tâche horaire sert de filet si la chaîne s'arrête.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = vérifier que tout marche, suivi = passage normal"
        type: choice
        options: [suivi, test]
        default: suivi

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: suivi
  cancel-in-progress: false

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow

      # Mémoire d'avant le retrait des recherches Ba&sh/Sézane en double (#16), pour en remettre les ventes
      - name: Mémoire ancienne (lecture)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: etat.json
          key: etat-40208461588
      - run: if [ -f etat.json ]; then mv etat.json etat_ancien.json; fi

      - name: Mémoire du suivi (lecture)
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Passage
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RECHERCHES: ${{ secrets.RECHERCHES }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python suivi.py --test
          else
            python suivi.py --boucle 2
          fi

      # Meilleures ventes : enregistrées dans le dépôt (au plus toutes les 3 h) pour être gardées pour de bon
      - name: Enregistrer les meilleures ventes
        if: ${{ !cancelled() && github.event.inputs.mode != 'test' && hashFiles('.base_a_enregistrer') != '' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add -A meilleures_ventes.json historique_ventes.json docs/meilleures/photos
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Meilleures ventes : mise à jour"
          for k in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Mémoire du suivi (écriture)
        if: ${{ !cancelled() && github.event.inputs.mode != 'test' && hashFiles('etat.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}

      - name: Préparer la page
        if: ${{ !cancelled() && github.event.inputs.mode != 'test' && hashFiles('docs/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier la page
        if: ${{ !cancelled() && github.event.inputs.mode != 'test' && hashFiles('docs/index.html') != '' }}
        uses: actions/deploy-pages@v4

      - name: Relancer le suivant
        if: ${{ !cancelled() && github.event.inputs.mode != 'test' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run suivi.yml --ref main -f mode=suivi
