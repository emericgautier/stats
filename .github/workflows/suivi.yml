name: Suivi des ventes

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = vérifier que tout marche, suivi = passage normal"
        type: choice
        options: [suivi, test]
        default: suivi

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: suivi
  cancel-in-progress: false

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Mémoire du suivi (lecture)
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Passage
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RECHERCHES: ${{ secrets.RECHERCHES }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python suivi.py --test
          else
            python suivi.py
          fi

      - name: Mémoire du suivi (écriture)
        if: github.event.inputs.mode != 'test' && hashFiles('etat.json') != ''
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}

      - name: Préparer la page
        if: github.event.inputs.mode != 'test' && hashFiles('docs/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier la page
        if: github.event.inputs.mode != 'test' && hashFiles('docs/index.html') != ''
        uses: actions/deploy-pages@v4
